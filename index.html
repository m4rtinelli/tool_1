<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tool_1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">prototype_1</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-import" class="btn btn-ghost">Import</button>
        <input id="file-input" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden />
        <button id="btn-export-svg" class="btn btn-ghost" disabled>Export SVG</button>
        <button id="btn-export-png" class="btn btn-ghost" disabled>Export PNG</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel">
        <section class="panel-group">
          <h3>Canvas</h3>
          <div class="ratio-select" id="ratio-select">
            <button class="ratio-btn active" data-ratio="1:1">1:1</button>
            <button class="ratio-btn" data-ratio="16:9">16:9</button>
            <button class="ratio-btn" data-ratio="9:16">9:16</button>
          </div>
        </section>

        <section class="panel-group">
          <h3>Shape</h3>
          <div class="segmented" id="shape-mode">
            <button class="segmented-btn active" data-mode="balls">Balls</button>
            <button class="segmented-btn" data-mode="lines">Lines</button>
          </div>
        </section>

        <section class="panel-group">
          <h3>Grid</h3>

          <label class="field">
            <div class="field-label">
              <span id="label-density">Ball density</span>
              <span class="field-value" id="val-density">48</span>
            </div>
            <input type="range" id="ctrl-density" min="4" max="150" step="1" value="48" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Min opacity cutoff</span>
              <span class="field-value" id="val-threshold">4%</span>
            </div>
            <input type="range" id="ctrl-threshold" min="0" max="50" step="1" value="4" />
          </label>
        </section>

        <section class="panel-group" id="ball-settings">
          <h3>Balls</h3>

          <label class="field">
            <div class="field-label">
              <span>Ball scale</span>
              <span class="field-value" id="val-scale">1.00</span>
            </div>
            <input type="range" id="ctrl-scale" min="0.1" max="1.8" step="0.01" value="1" />
          </label>
        </section>

        <section class="panel-group" id="line-settings" hidden>
          <h3>Lines</h3>

          <label class="field">
            <div class="field-label">
              <span>Line scale</span>
              <span class="field-value" id="val-line-scale">1.00</span>
            </div>
            <input type="range" id="ctrl-line-scale" min="0.1" max="2.5" step="0.01" value="1" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Line thickness</span>
              <span class="field-value" id="val-line-thickness">0.12</span>
            </div>
            <input type="range" id="ctrl-line-thickness" min="0.02" max="0.6" step="0.01" value="0.12" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Line angle</span>
              <span class="field-value" id="val-line-angle">45°</span>
            </div>
            <input type="range" id="ctrl-line-angle" min="0" max="360" step="1" value="45" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Angle jitter</span>
              <span class="field-value" id="val-line-angle-jitter">0°</span>
            </div>
            <input type="range" id="ctrl-line-angle-jitter" min="0" max="90" step="1" value="0" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Position jitter</span>
              <span class="field-value" id="val-line-position-jitter">0%</span>
            </div>
            <input type="range" id="ctrl-line-position-jitter" min="0" max="100" step="1" value="0" />
          </label>
        </section>

        <section class="panel-group">
          <h3>Motion</h3>

          <div class="field-inline" style="margin-bottom: 12px;">
            <span>Enable motion</span>
            <label class="switch">
              <input type="checkbox" id="ctrl-motion-enabled" />
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div id="motion-controls" hidden>
            <p class="hint" id="motion-hint">Waves scale the balls as the effector passes through them.</p>

            <div class="segmented" id="motion-shape">
              <button class="segmented-btn active" data-shape="circular">Circular</button>
              <button class="segmented-btn" data-shape="square">Square</button>
              <button class="segmented-btn" data-shape="triangular">Triangular</button>
              <button class="segmented-btn" data-shape="star">Star</button>
            </div>

            <div class="field">
              <div class="field-label">
                <span>Emission position</span>
                <span class="field-value" id="val-motion-position">50%, 50%</span>
              </div>
              <div class="position-pad" id="motion-pos-pad" title="Drag to move the effector. Double-click to reset to center.">
                <div class="position-pad-crosshair-h"></div>
                <div class="position-pad-crosshair-v"></div>
                <div class="position-pad-dot" id="motion-pos-dot"></div>
              </div>
            </div>

            <label class="field">
              <div class="field-label">
                <span>Speed</span>
                <span class="field-value" id="val-motion-speed">1.00</span>
              </div>
              <input type="range" id="ctrl-motion-speed" min="0.1" max="5" step="0.1" value="1" />
            </label>

            <label class="field">
              <div class="field-label">
                <span>Wave count</span>
                <span class="field-value" id="val-motion-waves">3</span>
              </div>
              <input type="range" id="ctrl-motion-waves" min="1" max="12" step="1" value="3" />
            </label>

            <label class="field">
              <div class="field-label">
                <span>Wave amplitude</span>
                <span class="field-value" id="val-motion-amplitude">60%</span>
              </div>
              <input type="range" id="ctrl-motion-amplitude" min="0" max="150" step="5" value="60" />
            </label>

            <div class="field-inline" style="margin-bottom: 10px;">
              <span id="label-motion-randomness">Randomize ball scale</span>
              <label class="switch">
                <input type="checkbox" id="ctrl-motion-randomness" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </label>
            </div>

            <label class="field" id="motion-randomness-amount-field" hidden>
              <div class="field-label">
                <span>Randomness amount</span>
                <span class="field-value" id="val-motion-randomness-amount">40%</span>
              </div>
              <input type="range" id="ctrl-motion-randomness-amount" min="0" max="100" step="5" value="40" />
            </label>
          </div>
        </section>

        <section class="panel-group">
          <h3>Color</h3>
          <div class="segmented" id="color-mode">
            <button class="segmented-btn active" data-mode="sample">Sample image</button>
            <button class="segmented-btn" data-mode="solid">Solid</button>
          </div>

          <div id="solid-color-controls" hidden>
            <div class="segmented" id="fill-type">
              <button class="segmented-btn active" data-fill="flat">Flat</button>
              <button class="segmented-btn" data-fill="linear">Linear</button>
              <button class="segmented-btn" data-fill="radial">Radial</button>
            </div>

            <label class="field field-inline">
              <span id="label-color-a">Color</span>
              <input type="color" id="ctrl-color-a" value="#3d5afe" />
            </label>

            <label class="field field-inline" id="color-b-field" hidden>
              <span>Color B</span>
              <input type="color" id="ctrl-color-b" value="#ff4d8d" />
            </label>

            <label class="field" id="gradient-angle-field" hidden>
              <div class="field-label">
                <span>Gradient angle</span>
                <span class="field-value" id="val-gradient-angle">90°</span>
              </div>
              <input type="range" id="ctrl-gradient-angle" min="0" max="360" step="1" value="90" />
            </label>
          </div>
        </section>

        <section class="panel-group">
          <h3>Background</h3>
          <div class="segmented" id="bg-mode">
            <button class="segmented-btn active" data-mode="transparent">Transparent</button>
            <button class="segmented-btn" data-mode="white">White</button>
            <button class="segmented-btn" data-mode="solid">Solid</button>
          </div>
          <label class="field field-inline" id="bg-color-field" hidden>
            <span>Background color</span>
            <input type="color" id="ctrl-bg-color" value="#0e0e12" />
          </label>
        </section>

        <section class="panel-group panel-group-footer">
          <div class="stat-row">
            <span id="label-stat-count">Balls rendered</span>
            <span id="stat-count">0</span>
          </div>
        </section>
      </aside>

      <main class="stage">
        <div class="stage-frame" id="stage-frame">
          <div class="empty-state" id="empty-state">
            <p>Drop an SVG or image here</p>
            <button id="btn-import-empty" class="btn btn-primary">Import a file</button>
          </div>
          <svg id="output-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
