<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball SVG — ASTRIDE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Ball&nbsp;SVG</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-import" class="btn btn-ghost">Import</button>
        <input id="file-input" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden />
        <button id="btn-export-svg" class="btn btn-ghost" disabled>Export SVG</button>
        <button id="btn-export-png" class="btn btn-ghost" disabled>Export PNG</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel">
        <section class="panel-group">
          <h3>Canvas</h3>
          <div class="ratio-select" id="ratio-select">
            <button class="ratio-btn active" data-ratio="1:1">1:1</button>
            <button class="ratio-btn" data-ratio="16:9">16:9</button>
            <button class="ratio-btn" data-ratio="9:16">9:16</button>
          </div>
        </section>

        <section class="panel-group">
          <h3>Balls</h3>

          <label class="field">
            <div class="field-label">
              <span>Ball scale</span>
              <span class="field-value" id="val-scale">1.00</span>
            </div>
            <input type="range" id="ctrl-scale" min="0.1" max="1.8" step="0.01" value="1" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Ball density</span>
              <span class="field-value" id="val-density">48</span>
            </div>
            <input type="range" id="ctrl-density" min="4" max="150" step="1" value="48" />
          </label>

          <label class="field">
            <div class="field-label">
              <span>Min opacity cutoff</span>
              <span class="field-value" id="val-threshold">4%</span>
            </div>
            <input type="range" id="ctrl-threshold" min="0" max="50" step="1" value="4" />
          </label>
        </section>

        <section class="panel-group">
          <h3>Color</h3>
          <div class="segmented" id="color-mode">
            <button class="segmented-btn active" data-mode="sample">Sample image</button>
            <button class="segmented-btn" data-mode="solid">Solid</button>
          </div>
          <label class="field field-inline" id="solid-color-field" hidden>
            <span>Ball color</span>
            <input type="color" id="ctrl-color" value="#3d5afe" />
          </label>
        </section>

        <section class="panel-group">
          <h3>Background</h3>
          <div class="segmented" id="bg-mode">
            <button class="segmented-btn active" data-mode="transparent">Transparent</button>
            <button class="segmented-btn" data-mode="white">White</button>
            <button class="segmented-btn" data-mode="solid">Solid</button>
          </div>
          <label class="field field-inline" id="bg-color-field" hidden>
            <span>Background color</span>
            <input type="color" id="ctrl-bg-color" value="#0e0e12" />
          </label>
        </section>

        <section class="panel-group panel-group-footer">
          <div class="stat-row">
            <span>Balls rendered</span>
            <span id="stat-count">0</span>
          </div>
        </section>
      </aside>

      <main class="stage">
        <div class="stage-frame" id="stage-frame">
          <div class="empty-state" id="empty-state">
            <p>Drop an SVG or image here</p>
            <button id="btn-import-empty" class="btn btn-primary">Import a file</button>
          </div>
          <svg id="output-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
